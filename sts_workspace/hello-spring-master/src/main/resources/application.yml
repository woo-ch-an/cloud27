# spring.application.name=hello-spring
# Spring 이외의 custom setting
app:
  jwt:
    issuer: hello-spring
#   secret-key: spring_security-secret-key-random-token-key
    secret-key: sndfjansknfjkajefnjkaelfnaleknfkjanefjkneas
# mybatis 연동 설정
mybatis:
  # mybatis 설정 파일 위치 지정.
  config-location: classpath:mybatis-config.xml
  # mapper 파일들의 위치 지정.
  mapper-locations: classpath:com/ktdsuniversity/edu/**/mapper/*Mapper.xml

spring:
  security:
    oauth2:
      client:
        # 개인정보 조회 요청을 하기 위해 인증절차를 거치는 설정 뭐 그런거 로뭐 시기 ?
        registration:
          google:
            client-id: 검열
            client-secret: 검
            client-name: GOOGLE
            scope: profile,email
          # 요청하는 Oauth 서비스를 식별할 수 있는 아이디 
          naver: 
            # 인증 아이디와 인증 키 설정
            client-id: 검열
            client-secret: 검열 
            # naver Oauth 를 구분 지을 이름 (Code 내부에서 쓸거 )
            client-name: Naver # Never 마렵네
        # 인증 절차를 거친 이후 요청한 개인정보를 받아오는 설정이다
            scope: name,email
            #사용자의 인증 방식
            authorization-grant-type: authorization_code
            
            
            # Naver login Call back url
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
        # 인증 절차를 거친 파도가 우리 앞을 막아서도 난 두ㄹ
        provider:
          naver:
            # Oauth Token 가져오는 인증 URL 
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            # 로그인한 회원의 개인정보 가져오는 url 
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버 전용 뭑있음 (표준을 지키지않는 네이버의 뭐시기 원래는 JSON 임 이메일이거고뭐고익거조겆 )
            # naver {response : {email:"asd", name : "asd""}} 이래요 
            user-name-attribute: response
  servlet:
    multipart: # 파일업로드 용량 정책 설정.
      # Spring Server가 한 번에 받을 수 있는 최대 용량
      max-file-size: 150MB
      # 파일 업로드를 할 수 있는 최대 용량
      max-request-size: 50MB
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    driver-class-name: oracle.jdbc.driver.OracleDriver
    username: SPRING_BOOT
    password: 1234
  application:
    name: hello-spring
    