<!doctype html>
<!-- 
 HTML을 작성하는 시점 : Tag  
 화면에 표시하는 시점 : Element
 (나중에 배울거)DOM TREE 기준 : Node

 HTML 태그의 역할
    Window를 생성하는 역할 / Window의 이름, 아이콘, 내용 지정(작성) 
    (Window -> 인터넷 브라우저에서 하나의 탭)

 -->
<html>
  <!-- Window의 Tab과 관련된 정보를 작성-->
  <head>
    <!-- Window Tab 이름 -->
    <title>HTML 생성하기</title>
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://naver.com//favicon.ico?1"
    />
    <meta charset="UTF-8" />
  </head>
